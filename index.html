<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Hub Portal</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('bg.gif') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        
        .logo-container {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 5rem; font-style: italic; color: #ffffff;
            margin-top: 20px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .highlight { background-color: #ff66b2; padding: 0px 30px; border-radius: 12px; margin-left: 15px; position: relative; }
        
        .dancing-skeleton {
            position: absolute;
            top: -75px; left: 50%;
            transform: translateX(-50%);
            width: 85px; height: auto;
            z-index: 10;
        }

        .control-panel {
            background-color: rgba(20, 20, 20, 0.85); border: 2px solid #333333; border-radius: 8px;
            padding: 10px 20px; width: 80%; max-width: 600px; text-align: center; display: flex; justify-content: space-around; align-items: center;
            margin-bottom: 15px;
        }
        .control-panel button {
            background-color: #ff66b2; color: white; border: none; padding: 10px 15px;
            font-weight: bold; font-size: 0.9rem; border-radius: 4px; cursor: pointer; width: 45%;
        }
        .control-panel button:hover { background-color: #ff3399; }

        .game-frame-container {
            width: 90%;
            height: 65vh;
            max-width: 1000px;
            background-color: #111;
            border: 3px solid #ff66b2;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
    <script>
        function launchSite(url) {
            document.getElementById('portal-screen').src = url;
        }
    </script>
</head>
<body>

    <div class="logo-container">
        Chill 
        <span class="highlight">
            Hub
            <img src="skeleton.gif" alt="Skeleton" class="dancing-skeleton">
        </span>
    </div>
    
    <div class="control-panel">
        <button onclick="launchSite('https://archive.org')">🎮 Pac-Man Game</button>
        <!-- This embeds a public sample video that works safely in iframe screens -->
        <button onclick="launchSite('https://w3schools.com')">📺 Play Test Video</button>
    </div>

    <div class="game-frame-container">
        <iframe id="portal-screen" src="about:blank" allowfullscreen></iframe>
    </div>

</body>
</html>
