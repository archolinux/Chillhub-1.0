<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Hub</title>
    <style>
        body {
            margin: 0; 
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            /* Universal background setup */
            background-color: #444;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow: hidden; 
            position: relative;
        }

        /* Ultimate trick to force hidden extensions to load */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('bg'), url('bg.png'), url('bg.jpg'), url('bg.jpeg'), url('bg.gif');
            background-size: cover;
            background-position: center;
            z-index: -1;
            opacity: 0.9;
        }
        
        .status-indicator { 
            position: absolute; 
            top: 40px; 
            left: 50px; 
            font-size: 2rem; 
            font-weight: bold; 
            color: #000000; 
        }
        
        .logo-container {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 7rem; 
            font-style: italic; 
            color: #ffffff;
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            position: relative;
        }
        
        .highlight { 
            background-color: #ff66b2; 
            padding: 0px 30px; 
            border-radius: 12px; 
            margin-left: 15px; 
            position: relative;
        }

        .dancing-skeleton {
            position: absolute;
            top: -95px; 
            left: 50%;
            transform: translateX(-50%);
            width: 110px; 
            height: auto;
            z-index: 10;
        }
        
        .control-panel {
            background-color: rgba(20, 20, 20, 0.85); 
            border: 2px solid #333333; 
            border-radius: 8px;
            padding: 25px; 
            width: 320px; 
            text-align: center;
        }
        .control-panel input[type="text"] {
            width: 90%; padding: 10px; background-color: #111111; border: 1px solid #444444;
            border-radius: 4px; color: #ffffff; font-size: 1rem; text-align: center; margin-bottom: 15px;
        }
        .control-panel button {
            background-color: #ff66b2; color: white; border: none; padding: 10px 20px;
            font-weight: bold; font-size: 1rem; border-radius: 4px; cursor: pointer; width: 90%;
        }
    </style>
</head>
<body>

    <div class="status-indicator">Online</div>

    <div class="logo-container">
        Chill 
        <span class="highlight">
            Hub
            <img src="skeleton.gif" alt="Skeleton" class="dancing-skeleton" onerror="this.src='skeleton.png'; this.onerror=this.src='skeleton.jpg';">
        </span>
    </div>
    
    <div class="control-panel">
        <form action="/go" method="POST">
            <input type="text" name="url" placeholder="Enter URL to browse..." required>
            <button type="submit">Launch Proxy</button>
        </form>
    </div>

</body>
</html>
