<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Hub v1.2 - Arcade Dashboard</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('bg.gif') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            overflow-y: auto; padding: 20px 0;
            box-sizing: border-box;
        }
        
        .logo-container {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 4rem; font-style: italic; color: #ffffff;
            margin-bottom: 5px; display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .highlight { background-color: #ff66b2; padding: 0px 25px; border-radius: 12px; margin-left: 15px; position: relative; }
        
        .dancing-skeleton {
            position: absolute;
            top: -65px; left: 50%;
            transform: translateX(-50%);
            width: 75px; height: auto;
            z-index: 10;
        }

        /* Top Arena Console */
        .arcade-container {
            background-color: rgba(20, 20, 20, 0.9); 
            border: 3px solid #ff66b2; 
            border-radius: 12px;
            padding: 15px; 
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
            width: 420px;
            margin-bottom: 20px;
        }
        canvas { background-color: #111; border: 2px solid #333; display: block; margin: 10px auto; }
        .score { color: #fff; font-size: 1.3rem; font-weight: bold; }
        .instructions { color: #a0a0c0; font-size: 0.85rem; margin-top: 5px; }

        /* Bottom Arena Console: 100% Filter-Proof Clicker Game */
        .clicker-container {
            background-color: rgba(20, 20, 20, 0.9);
            border: 3px solid #ff66b2;
            border-radius: 12px;
            padding: 20px;
            width: 420px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            color: white;
        }
        .clicker-title { color: #00ffcc; font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .big-cookie-btn {
            background-color: #ff66b2; color: white; border: none; font-size: 4rem; 
            width: 120px; height: 120px; border-radius: 50%; cursor: pointer; margin: 15px auto;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0px 5px 15px rgba(255, 102, 178, 0.4);
            transition: transform 0.1s;
        }
        .big-cookie-btn:active { transform: scale(0.92); }
        .clicker-score { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
        .upgrade-btn {
            background-color: #333; color: #00ffcc; border: 1px solid #00ffcc;
            padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer;
        }
        .upgrade-btn:hover { background-color: #00ffcc; color: #111; }
    </style>
</head>
<body>

    <div class="logo-container">
        Chill 
        <span class="highlight">
            Hub <small style="font-size: 1rem; vertical-align: super; color: #111;">v1.2</small>
            <img src="skeleton.gif" alt="Skeleton" class="dancing-skeleton">
        </span>
    </div>
    
    <!-- Top Console: Snake -->
    <div class="arcade-container">
        <div class="score">Snake Score: <span id="score-val">0</span></div>
        <canvas id="snakeGame" width="400" height="300"></canvas>
        <div class="instructions">Use Arrow Keys to play Snake up here!</div>
    </div>

    <!-- Bottom Console: Filter-Proof Minecoin Clicker -->
    <div class="clicker-container">
        <div class="clicker-title">Minecoin Clicker</div>
        <div class="clicker-score">Coins: <span id="coin-count">0</span></div>
        <button class="big-cookie-btn" onclick="clickCookie()">⛏️</button>
        <div style="margin-top: 10px;">
            <button class="upgrade-btn" id="upgrade-btn-el" onclick="buyUpgrade()">Buy Super Pickaxe (Cost: 50)</button>
        </div>
        <div class="instructions" style="margin-top: 10px;" id="upgrade-status">Multiplier: +1 per click</div>
    </div>

    <script>
        // --- CLICKER GAME LOGIC ---
        let coins = 0;
        let multiplier = 1;
        let upgradeCost = 50;

        function clickCookie() {
            coins += multiplier;
            document.getElementById('coin-count').innerText = coins;
        }

        function buyUpgrade() {
            if (coins >= upgradeCost) {
                coins -= upgradeCost;
                multiplier += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                document.getElementById('coin-count').innerText = coins;
                document.getElementById('upgrade-btn-el').innerText = "Buy Super Pickaxe (Cost: " + upgradeCost + ")";
                document.getElementById('upgrade-status').innerText = "Multiplier: +" + multiplier + " per click";
            } else {
                alert("Not enough coins yet! Keep mining!");
            }
        }

        // --- SNAKE GAME LOGIC ---
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const grid = 20; let count = 0; let score = 0;
        let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [{x: 160, y: 160}, {x: 140, y: 160}], maxCells: 4 };
        let apple = { x: 320, y: 200 };
        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }
        function loop() {
            requestAnimationFrame(loop); if (++count < 6) return; count = 0;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            snake.x += snake.dx; snake.y += snake.dy;
            if (snake.x < 0) snake.x = canvas.width - grid; else if (snake.x >= canvas.width) snake.x = 0;
            if (snake.y < 0) snake.y = canvas.height - grid; else if (snake.y >= canvas.height) snake.y = 0;
            snake.cells.unshift({x: snake.x, y: snake.y}); if (snake.cells.length > snake.maxCells) snake.cells.pop();
            ctx.fillStyle = '#ff3366'; ctx.fillRect(apple.x, apple.y, grid-1, grid-1);
            ctx.fillStyle = '#00ffcc';
            snake.cells.forEach(function(cell, index) {
                ctx.fillRect(cell.x, cell.y, grid-1, grid-1);  
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++; score += 10; document.getElementById('score-val').innerText = score;
                    apple.x = getRandomInt(0, 20) * grid; apple.y = getRandomInt(0, 15) * grid;
                }
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        snake.x = 160; snake.y = 160; snake.cells = [{x: 160, y: 160}, {x: 140, y: 160}];
                        snake.maxCells = 4; snake.dx = grid; snake.dy = 0; score = 0;
                        document.getElementById('score-val').innerText = score;
                    }
                }
            });
        }
        document.addEventListener('keydown', function(e) {
            if (e.which === 37 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (e.which === 38 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (e.which === 39 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (e.which === 40 && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
        });
        requestAnimationFrame(loop);
    </script>
</body>
</html>
