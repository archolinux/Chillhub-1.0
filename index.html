<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Hub v1.3 - Ultimate Arcade Portal</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('bg.gif') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            overflow-y: auto; padding: 20px 0;
            box-sizing: border-box;
        }
        
        .logo-container {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 4rem; font-style: italic; color: #ffffff;
            margin-bottom: 5px; display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .highlight { background-color: #ff66b2; padding: 0px 25px; border-radius: 12px; margin-left: 15px; position: relative; }
        
        .dancing-skeleton {
            position: absolute;
            top: -65px; left: 50%;
            transform: translateX(-50%);
            width: 75px; height: auto;
            z-index: 10;
        }

        /* Top Module Console */
        .arcade-container {
            background-color: rgba(20, 20, 20, 0.9); 
            border: 3px solid #ff66b2; 
            border-radius: 12px;
            padding: 15px; 
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
            width: 420px;
            margin-bottom: 20px;
        }
        canvas { background-color: #111; border: 2px solid #333; display: block; margin: 10px auto; outline: none; }
        .score { color: #fff; font-size: 1.3rem; font-weight: bold; }
        .instructions { color: #00ffcc; font-size: 0.9rem; font-weight: bold; margin-top: 5px; }

        /* Bottom Module Console: Custom Web Ports */
        .portal-container {
            background-color: rgba(20, 20, 20, 0.9);
            border: 3px solid #ff66b2;
            border-radius: 12px;
            padding: 15px;
            width: 95%;
            max-width: 800px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            color: white;
            box-sizing: border-box;
        }
        .portal-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .portal-menu button {
            background-color: #ff66b2; color: white; border: none; padding: 10px 15px;
            font-weight: bold; font-size: 0.9rem; border-radius: 4px; cursor: pointer;
            transition: background 0.2s;
        }
        .portal-menu button:hover { background-color: #ff3399; }
        .portal-menu button.active { background-color: #00ffcc; color: #111; }
        
        .utility-screen {
            width: 100%;
            height: 400px;
            background-color: #111;
            border: 2px solid #333;
            border-radius: 6px;
            box-sizing: border-box;
            overflow: hidden;
            display: none;
            position: relative;
        }
        .utility-screen.active { display: block; }
    </style>
</head>
<body>

    <div class="logo-container">
        Chill 
        <span class="highlight">
            Hub <small style="font-size: 1rem; vertical-align: super; color: #111;">v1.3</small>
            <img src="skeleton.gif" alt="Skeleton" class="dancing-skeleton">
        </span>
    </div>
    
    <!-- Top Console Module: Snake Game -->
    <div class="arcade-container">
        <div class="score">Snake Game Console: <span id="score-val">0</span></div>
        <canvas id="snakeGame" width="400" height="220" tabindex="0"></canvas>
        <div class="instructions">Click console & use Arrow Keys to move!</div>
    </div>

    <!-- Bottom Console Module: Web Game Ports -->
    <div class="portal-container">
        <div class="portal-menu">
            <button id="tab-pong" class="active" onclick="openPort('pong')">🏓 Pong Port</button>
            <button id="tab-clicker" onclick="openPort('clicker')">鼠标 Retro Clicker</button>
        </div>

        <!-- PORT 1: SCHOOL-SAFE PONG GAME (NO IFRAME) -->
        <div id="port-pong" class="utility-screen active">
            <p style="margin-top:10px; color:#00ffcc; font-weight:bold; margin-bottom: 0;">Unblocked Retro Pong Port</p>
            <canvas id="pongGame" width="700" height="330" tabindex="0"></canvas>
        </div>

        <!-- PORT 2: CYBER CLICKER GAME -->
        <div id="port-clicker" class="utility-screen" style="padding: 20px; text-align: center;">
            <p style="margin-top:0; color:#00ffcc; font-weight:bold;">Neon Energy Clicker Port</p>
            <div style="margin-top: 30px;">
                <h2 style="font-size: 2.5rem; color: #ff66b2; margin-bottom: 5px;">Energy: <span id="click-count">0</span></h2>
                <p style="color: #888; margin-top: 0;">Energy Per Click: +<span id="click-power">1</span></p>
                <button onclick="boopCore()" style="background: radial-gradient(#00ffcc, #00b386); border: none; width: 120px; height: 120px; border-radius: 50%; font-weight: bold; font-size: 1.2rem; color: #111; cursor: pointer; box-shadow: 0 0 15px #00ffcc; outline: none; margin-top: 10px;">CORE</button>
            </div>
            <div style="margin-top: 30px;">
                <button id="upgrade-btn" onclick="buyUpgrade()" style="background-color: #ff66b2; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer;">Upgrade Clicker (Cost: 10 Energy)</button>
            </div>
        </div>
    </div>

    <script>
        // --- PORT SWITCHING PIPELINE ---
        function openPort(portName) {
            document.querySelectorAll('.utility-screen').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.portal-menu button').forEach(el => el.classList.remove('active'));
            
            document.getElementById('port-' + portName).classList.add('active');
            document.getElementById('tab-' + portName).classList.add('active');
        }

        // ==========================================
        // 🐍 SNAKE GAME ENGINE (Top Console)
        // ==========================================
        const snakeCanvas = document.getElementById("snakeGame");
        const snakeCtx = snakeCanvas.getContext("2d");
        const grid = 10;
        let count = 0;
        let snakeScore = 0;
        let snake = { x: 160, y: 110, dx: grid, dy: 0, cells: [], maxCells: 4 };
        let apple = { x: 320, y: 110 };

        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }
        function resetSnake() {
            snake.x = 160; snake.y = 110; snake.cells = []; snake.maxCells = 4;
            snake.dx = grid; snake.dy = 0; snakeScore = 0;
            document.getElementById('score-val').innerText = snakeScore;
        }

        function loopSnake() {
            requestAnimationFrame(loopSnake);
            if (++count < 6) return;
            count = 0;
            snakeCtx.clearRect(0,0,snakeCanvas.width,snakeCanvas.height);
            snake.x += snake.dx; snake.y += snake.dy;

            if (snake.x < 0) snake.x = snakeCanvas.width - grid;
            else if (snake.x >= snakeCanvas.width) snake.x = 0;
            if (snake.y < 0) snake.y = snakeCanvas.height - grid;
            else if (snake.y >= snakeCanvas.height) snake.y = 0;

            snake.cells.unshift({x: snake.x, y: snake.y});
            if (snake.cells.length > snake.maxCells) snake.cells.pop();

            snakeCtx.fillStyle = '#ff3366';
            snakeCtx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

            snakeCtx.fillStyle = '#00ffcc';
            snake.cells.forEach(function(cell, index) {
                snakeCtx.fillRect(cell.x, cell.y, grid - 1, grid - 1);
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    snakeScore += 10;
                    document.getElementById('score-val').innerText = snakeScore;
                    apple.x = getRandomInt(0, snakeCanvas.width / grid) * grid;
                    apple.y = getRandomInt(0, snakeCanvas.height / grid) * grid;
                }
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) { resetSnake(); }
                }
            });
        }
        window.addEventListener('keydown', function(e) {
            if (e.which === 37 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (e.which === 38 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (e.which === 39 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (e.which === 40 && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
        });
        requestAnimationFrame(loopSnake);

        // ==========================================
        // 🏓 UNBLOCKED RETRO PONG ENGINE (Port 1)
        // ==========================================
        const pongCanvas = document.getElementById("pongGame");
        const pongCtx = pongCanvas.getContext("2d");
        
        let paddleW = 10, paddleH = 60;
        let p1Y = (pongCanvas.height - paddleH) / 2;
        let p2Y = (pongCanvas.height - paddleH) / 2;
        let ballX = pongCanvas.width / 2, ballY = pongCanvas.height / 2;
        let ballSize = 8;
        let ballSpeedX = 4, ballSpeedY = 3;
        let p1Score = 0, p2Score = 0;
        pongCanvas.addEventListener("mousemove", function(e) {
let rect = pongCanvas.getBoundingClientRect();
p1Y = e.clientY - rect.top - paddleH / 2;
});
function loopPong() {
requestAnimationFrame(loopPong);
pongCtx.clearRect(0, 0, pongCanvas.width, pongCanvas.height);
// Move AI Paddle (Right side)
let p2Center = p2Y + paddleH / 2;
if (p2Center < ballY - 15) p2Y += 3.5;
else if (p2Center > ballY + 15) p2Y -= 3.5;
// Move Ball
ballX += ballSpeedX;
ballY += ballSpeedY;
// Wall bounces (Top / Bottom)
if (ballY <= 0 || ballY >= pongCanvas.height - ballSize) ballSpeedY = -ballSpeedY;
// Paddle 1 Collision (Player)
if (ballX <= paddleW + 5) {
if (ballY > p1Y && ballY < p1Y + paddleH) {
ballSpeedX = -ballSpeedX;
ballSpeedX *= 1.05; // speed up slightly
} else if (ballX < 0) {
p2Score++;
resetBall();
}
}
// Paddle 2 Collision (AI Computer)
if (ballX >= pongCanvas.width - paddleW - 5 - ballSize) {
if (ballY > p2Y && ballY < p2Y + paddleH) {
ballSpeedX = -ballSpeedX;
} else if (ballX > pongCanvas.width) {
p1Score++;
resetBall();
}
}
function resetBall() {
ballX = pongCanvas.width / 2;
ballY = pongCanvas.height / 2;
ballSpeedX = -ballSpeedX > 0 ? 4 : -4;
ballSpeedY = 3;
}
// Draw Paddles
pongCtx.fillStyle = "#ff66b2"; // Player Left
pongCtx.fillRect(5, p1Y, paddleW, paddleH);
pongCtx.fillStyle = "#ff007f"; // AI Right
pongCtx.fillRect(pongCanvas.width - paddleW - 5, p2Y, paddleW, paddleH);
// Draw Ball
pongCtx.fillStyle = "#00ffcc";
pongCtx.fillRect(ballX, ballY, ballSize, ballSize);
// Draw Scores
pongCtx.font = "20px Arial";
pongCtx.fillStyle = "#ffffff";
pongCtx.fillText(p1Score, pongCanvas.width / 4, 30);
pongCtx.fillText(p2Score, (pongCanvas.width / 4) * 3, 30);
}
loopPong();
// ==========================================
// 鼠标 CYBER CLICKER ENGINE (Port 2)
// ==========================================
let energy = 0;
let power = 1;
let upgradeCost = 10;
function boopCore() {
energy += power;
document.getElementById("click-count").innerText = energy;
}
function buyUpgrade() {
if (energy >= upgradeCost) {
energy -= upgradeCost;
power += 1;
upgradeCost = Math.floor(upgradeCost * 1.8);
document.getElementById("click-count").innerText = energy;
document.getElementById("click-power").innerText = power;
document.getElementById("upgrade-btn").innerText = Upgrade Clicker (Cost: ${upgradeCost} Energy);
} else {
alert("Insufficient core energy!");
}
}
