<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Hub Arcade</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('bg.gif') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        
        .logo-container {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 4.5rem; font-style: italic; color: #ffffff;
            margin-bottom: 10px; display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .highlight { background-color: #ff66b2; padding: 0px 25px; border-radius: 12px; margin-left: 15px; position: relative; }
        
        .dancing-skeleton {
            position: absolute;
            top: -65px; left: 50%;
            transform: translateX(-50%);
            width: 75px; height: auto;
            z-index: 10;
        }

        /* The Arcade Cabinet Box */
        .arcade-container {
            background-color: rgba(20, 20, 20, 0.9); 
            border: 3px solid #ff66b2; 
            border-radius: 12px;
            padding: 20px; 
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
        }

        canvas {
            background-color: #111;
            border: 2px solid #333;
            display: block;
            margin: 10px auto;
        }

        .score {
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .instructions {
            color: #a0a0c0;
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        Chill 
        <span class="highlight">
            Hub
            <img src="skeleton.gif" alt="Skeleton" class="dancing-skeleton">
        </span>
    </div>
    
    <!-- Game Screen Arena -->
    <div class="arcade-container">
        <div class="score">Score: <span id="score-val">0</span></div>
        <canvas id="snakeGame" width="400" height="400"></canvas>
        <div class="instructions">Use your Chromebook Arrow Keys to control the snake!</div>
    </div>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const grid = 20;
        let count = 0;
        let score = 0;
        
        let snake = {
            x: 160, y: 160,
            dx: grid, dy: 0,
            cells: [{x: 160, y: 160}, {x: 140, y: 160}],
            maxCells: 4
        };
        
        let apple = { x: 320, y: 320 };

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        // Main game loop engine
        function loop() {
            requestAnimationFrame(loop);
            if (++count < 6) return; // Controls game speed
            count = 0;
            
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            snake.x += snake.dx;
            snake.y += snake.dy;
            
            // Screen wrap-around bounds
            if (snake.x < 0) snake.x = canvas.width - grid;
            else if (snake.x >= canvas.width) snake.x = 0;
            if (snake.y < 0) snake.y = canvas.height - grid;
            else if (snake.y >= canvas.height) snake.y = 0;
            
            snake.cells.unshift({x: snake.x, y: snake.y});
            if (snake.cells.length > snake.maxCells) snake.cells.pop();
            
            // Draw apple
            ctx.fillStyle = '#ff3366';
            ctx.fillRect(apple.x, apple.y, grid-1, grid-1);
            
            // Draw snake body
            ctx.fillStyle = '#00ffcc';
            snake.cells.forEach(function(cell, index) {
                ctx.fillRect(cell.x, cell.y, grid-1, grid-1);  
                
                // Snake eats apple rule
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    score += 10;
                    document.getElementById('score-val').innerText = score;
                    apple.x = getRandomInt(0, 20) * grid;
                    apple.y = getRandomInt(0, 20) * grid;
                }
                
                // Self-collision crash check
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        snake.x = 160; snake.y = 160;
                        snake.cells = [{x: 160, y: 160}, {x: 140, y: 160}];
                        snake.maxCells = 4;
                        snake.dx = grid; snake.dy = 0;
                        score = 0;
                        document.getElementById('score-val').innerText = score;
                    }
                }
            });
        }

        // Listen for Chromebook keyboard arrow presses
        document.addEventListener('keydown', function(e) {
            if (e.which === 37 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (e.which === 38 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (e.which === 39 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (e.which === 40 && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
        });

        requestAnimationFrame(loop);
    </script>

</body>
</html>
